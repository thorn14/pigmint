surfaces:
  surface.main:
    ramp: neutral
    lightStep: 0
    darkStep: 10
  surface.elevated:
    ramp: neutral
    lightStep: 1
    darkStep: 9

foreground:
  foreground.main:
    ramp: neutral
    surfaces: [surface.main]
    preference: highest-contrast
    level: AAA
  foreground.muted:
    ramp: neutral
    surfaces: [surface.main]
    preference: matched-to-set
    consistency: matched-across-ramps

nonText:
  action.primary.background:
    ramp: blue
    surfaces: [surface.main]
    preference: lowest-passing
  action.primary.text:
    ramp: neutral
    surfaces: [surface.main]
    preference: highest-contrast
  action.secondary.background:
    ramp: slate
    surfaces: [surface.main]
    preference: lowest-passing
  action.secondary.text:
    ramp: neutral
    surfaces: [surface.main]
    preference: highest-contrast
  border.main:
    ramp: neutral
    surfaces: [surface.main]
    preference: lowest-passing
  feedback.danger.background:
    ramp: danger
    surfaces: [surface.main]
    preference: lowest-passing
  feedback.warning.background:
    ramp: warning
    surfaces: [surface.main]
    preference: lowest-passing
  feedback.info.background:
    ramp: info
    surfaces: [surface.main]
    preference: lowest-passing
  feedback.success.background:
    ramp: success
    surfaces: [surface.main]
    preference: lowest-passing
