surfaces:
  surface.main:
    ramp: neutral
    lightStep: 0
    darkStep: 10
  surface.elevated:
    ramp: neutral
    lightStep: 1
    darkStep: 9
  surface.subtle:
    ramp: neutral
    lightStep: 2
    darkStep: 8
  surface.inverse:
    ramp: neutral
    lightStep: 10
    darkStep: 0

foreground:
  foreground.main:
    ramp: neutral
    surfaces: [surface.main]
    preference: highest-contrast
    level: AAA
  foreground.muted:
    ramp: neutral
    surfaces: [surface.main]
    preference: matched-to-set
    consistency: matched-across-ramps
  foreground.subtle:
    ramp: neutral
    surfaces: [surface.main]
    preference: lowest-passing
    consistency: matched-across-ramps
  foreground.inverse:
    ramp: neutral
    surfaces: [surface.inverse]
    preference: highest-contrast

nonText:
  action.primary.background:
    ramp: blue
    surfaces: [surface.main]
    preference: lowest-passing
  action.primary.text:
    ramp: neutral
    surfaces: [surface.main]
    preference: highest-contrast
  action.secondary.background:
    ramp: slate
    surfaces: [surface.main]
    preference: lowest-passing
  action.secondary.text:
    ramp: neutral
    surfaces: [surface.main]
    preference: highest-contrast
  border.main:
    ramp: neutral
    surfaces: [surface.main]
    preference: lowest-passing
  border.subtle:
    ramp: neutral
    surfaces: [surface.main]
    preference: lowest-passing
  border.prominent:
    ramp: neutral
    surfaces: [surface.main]
    preference: highest-contrast
  feedback.danger.background:
    ramp: danger
    surfaces: [surface.main]
    preference: lowest-passing
  feedback.danger.text:
    ramp: danger
    surfaces: [surface.main]
    preference: highest-contrast
  feedback.danger.border:
    ramp: danger
    surfaces: [surface.main]
    preference: highest-contrast
  feedback.success.background:
    ramp: success
    surfaces: [surface.main]
    preference: lowest-passing
  feedback.success.text:
    ramp: success
    surfaces: [surface.main]
    preference: highest-contrast
  feedback.success.border:
    ramp: success
    surfaces: [surface.main]
    preference: highest-contrast
  feedback.warning.background:
    ramp: warning
    surfaces: [surface.main]
    preference: lowest-passing
  feedback.warning.text:
    ramp: warning
    surfaces: [surface.main]
