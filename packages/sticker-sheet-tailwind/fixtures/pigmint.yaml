defaults:
  vocabulary: ./tokens.yaml

engine:
  compliance: wcag21
  target: AA
  modes:
    - light
    - dark
    - light-high-contrast
    - dark-high-contrast
  cvd:
    - deuteranopia
    - protanopia
    - tritanopia
ramps:
  - name: neutral
    source: "#888888"
  - name: blue
    source: "#3366cc"
  - name: slate
    source: "#64748b"
  - name: success
    source: "#16a34a"
  - name: danger
    source: "#dc2626"
  - name: warning
    source: "#d97706"
  - name: info
    source: "#0284c7"
adapters:
  - name: tailwind
    output: ../src/generated
    preset: shadcn
    formats:
      - oklch
output:
  dtcg: ../src/generated/tokens.json
audit:
  report: ../src/generated/audit.json
  profile: wcag-srgb
